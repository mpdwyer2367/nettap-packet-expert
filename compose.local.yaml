services:
  open-webui:
    ports:
      - "${BIND_ADDRESS}:${WEB_PORT}:8080"

  evidence-service:
    environment:
      NETTAP_OPEN_WEBUI_PUBLIC_URL: http://${BIND_ADDRESS}:${WEB_PORT}
    ports:
      - "${BIND_ADDRESS}:${EVIDENCE_PORT}:8081"

  assistant-launcher:
    image: ${CADDY_IMAGE}
    init: true
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128
    environment:
      SUITE_URL: http://${BIND_ADDRESS}:${WEB_PORT}
      NETTAP_VISIBILITY_PROFILE: ${NETTAP_VISIBILITY_PROFILE}
      NETTAP_PACKET_EXPERT_PROFILE: ${NETTAP_PACKET_EXPERT_PROFILE}
    ports:
      - "${BIND_ADDRESS}:${VISIBILITY_LAUNCHER_PORT}:3000"
      - "${BIND_ADDRESS}:${PACKET_EXPERT_LAUNCHER_PORT}:3001"
    volumes:
      - ./config/Launcher.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./launchers:/srv:ro
    networks: [user-access]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The official Caddy binary carries the cap_net_bind_service file
    # capability. Keep only that capability in the container bounding set so
    # execve can start Caddy; all other Linux capabilities remain dropped.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
