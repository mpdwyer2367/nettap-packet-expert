services:
  open-webui:
    environment:
      # Local recovery may intentionally use a simple development credential.
      # The production overlay retains the strong-password policy from compose.yaml.
      ENABLE_PASSWORD_VALIDATION: "False"
    ports:
      - "${BIND_ADDRESS}:${WEB_PORT}:8080"

  evidence-service:
    ports:
      - "${BIND_ADDRESS}:${EVIDENCE_PORT}:8081"

  assistant-launcher:
    image: ${CADDY_IMAGE}
    init: true
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128
    environment:
      SUITE_URL: http://${BIND_ADDRESS}:${WEB_PORT}
      NETTAP_VISIBILITY_PROFILE: ${NETTAP_VISIBILITY_PROFILE}
      NETTAP_PACKET_EXPERT_PROFILE: ${NETTAP_PACKET_EXPERT_PROFILE}
    ports:
      - "${BIND_ADDRESS}:${VISIBILITY_LAUNCHER_PORT}:3000"
      - "${BIND_ADDRESS}:${PACKET_EXPERT_LAUNCHER_PORT}:3001"
    volumes:
      - ./config/Launcher.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./launchers:/srv:ro
    networks: [user-access]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz >/dev/null &&
          curl --fail --silent --show-error http://127.0.0.1:3001/healthz >/dev/null
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# Local services publish only to BIND_ADDRESS, which defaults to 127.0.0.1.
# Docker Desktop requires this network to accept the explicitly published host
# ports. Production does not load this override and keeps user-access internal
# behind the TLS gateway.
networks:
  user-access:
    internal: false
