name: nettap-packet-expert

services:
  ollama:
    image: ${OLLAMA_IMAGE}
    init: true
    restart: unless-stopped
    cpus: ${OLLAMA_CPUS}
    mem_limit: ${OLLAMA_MEMORY}
    pids_limit: 1024
    volumes:
      - packet-expert-ollama-data:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  model-init:
    image: ${OLLAMA_IMAGE}
    profiles: ["initialize"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./model:/model:ro
    networks: [backend]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull qwen3:8b &&
        actual_id="$$(ollama list | awk '$$1 == "qwen3:8b" {print $$2}')" &&
        test "$$actual_id" = "${EXPECTED_BASE_MODEL_ID}" &&
        ollama create ${MODEL_NAME} -f /model/Modelfile &&
        ollama show ${MODEL_NAME}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    init: true
    restart: unless-stopped
    cpus: ${WEBUI_CPUS}
    mem_limit: ${WEBUI_MEMORY}
    pids_limit: 1024
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "True"
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      ENABLE_SIGNUP: "False"
      DEFAULT_USER_ROLE: pending
      ENABLE_PASSWORD_VALIDATION: "True"
      ENABLE_PASSWORD_CHANGE_FORM: "True"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PASSWORD_VALIDATION_REGEX_PATTERN: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{12,72}$$'
      PASSWORD_VALIDATION_HINT: "Use 12-72 characters with upper, lower, number, and symbol."
      ENABLE_PERSISTENT_CONFIG: "False"
      OFFLINE_MODE: "True"
      ENABLE_OPENAI_API: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      ENABLE_RAG_LOCAL_WEB_FETCH: "False"
      ENABLE_SUBAGENTS: "False"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_EXPORT: "False"
      USER_PERMISSIONS_CHAT_IMPORT: "False"
      USER_PERMISSIONS_CHAT_SHARE: "False"
      USER_PERMISSIONS_CHAT_ALLOW_PUBLIC_SHARING: "False"
      USER_PERMISSIONS_CHAT_ALLOW_OPEN_SHARING: "False"
      USER_PERMISSIONS_CHAT_CONTINUE_RESPONSE: "False"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "False"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "False"
      USER_PERMISSIONS_FEATURES_USER_WEBHOOKS: "False"
      USER_PERMISSIONS_FEATURES_API_KEYS: "False"
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_EXPORT: "False"
      AUDIT_LOG_LEVEL: METADATA
      ENABLE_AUDIT_LOGS_FILE: "True"
      AUDIT_LOGS_FILE_PATH: /app/backend/data/audit.log
      AUDIT_LOG_FILE_ROTATION_SIZE: 10MB
      ENABLE_AUDIT_STDOUT: "True"
      GLOBAL_LOG_LEVEL: INFO
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "False"
      ENABLE_API_KEYS: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_USER_WEBHOOKS: "False"
      ENABLE_MEMORIES: "False"
      ENABLE_ADMIN_EXPORT: "False"
      ENABLE_ADMIN_CHAT_ACCESS: "False"
      BYPASS_ADMIN_ACCESS_CONTROL: "False"
      SHOW_ADMIN_DETAILS: "False"
      ENABLE_PUBLIC_ACTIVE_USERS_COUNT: "False"
      ENABLE_USER_STATUS: "False"
      RESPONSE_WATERMARK: "AI-generated engineering guidance; verify before use."
      IFRAME_CSP: "default-src 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; script-src 'none'; frame-src 'none'"
      DEFAULT_MODELS: ${MODEL_NAME}
      DEFAULT_PINNED_MODELS: ${MODEL_NAME}
      MODEL_ORDER_LIST: '["${MODEL_NAME}"]'
      WEBUI_BANNERS: >-
        [{"id":"nettap-bootstrap-password-rc9","type":"warning","title":"Complete administrator activation","content":"This installation generated a unique bootstrap credential. Change it in Settings > Account, verify the old credential fails, then run the administrator finalization command before enabling production access.","dismissible":false,"timestamp":1785864000}]
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["Analyze Packet Capture","Build an evidence-led L2-L7 assessment"],"content":"Analyze the attached PCAP or PCAPNG. Establish capture context and evidence quality first, then summarize protocol distribution, endpoints, conversations, application behavior, performance symptoms, and security findings. Separate observed facts, derived metrics, hypotheses, and recommended validation. Cite frame numbers and timestamps for substantive findings."},{"title":["Diagnose TCP Performance","Separate network, server, and client symptoms"],"content":"Diagnose TCP performance in the attached capture. Evaluate handshakes, RTT indicators, retransmissions, duplicate ACKs, out-of-order traffic, resets, zero windows, window scaling, stalls, and throughput. Identify the affected flows and distinguish network loss, endpoint delay, receiver pressure, and capture artifacts with frame and time evidence."},{"title":["Validate Capture Quality","Check whether the evidence supports conclusions"],"content":"Assess the quality and limitations of this capture before interpreting traffic. Review acquisition point, directionality, snap length, packet drops, timestamp behavior, duplicates, truncation, SPAN or TAP limitations, NPB filtering or slicing, and endpoint offload artifacts. State what is reliable, uncertain, missing, and the best next capture to collect."},{"title":["Investigate Suspicious Host","Trace behavior and test benign alternatives"],"content":"Investigate the suspicious host in the attached capture. Build a timeline of its flows, peers, DNS activity, TLS or QUIC metadata, authentication exposure, lateral movement indicators, and unusual periodicity or data transfer. Compare suspicious evidence with benign alternatives, state confidence, and cite frames and timestamps."},{"title":["Audit DNS and TLS","Evaluate resolution, encryption, and anomalies"],"content":"Audit DNS and TLS or QUIC behavior in the attached capture. Evaluate query and response health, latency, failures, unusual names, tunneling indicators, TLS versions, SNI, certificate metadata, alerts, handshake failures, and encrypted-session patterns. Cite the supporting flows, frames, and timestamps and explain what encrypted payloads do not reveal."},{"title":["Hunt C2 and Exfiltration","Baseline traffic before assessing threats"],"content":"Hunt for command-and-control and data-exfiltration indicators in the attached capture. Establish a normal-traffic baseline, then examine periodic connections, rare destinations, DNS behavior, TLS metadata, traffic asymmetry, unusual volumes, tunneling, and long-lived sessions. Distinguish suspicious from confirmed malicious activity and include evidence, alternatives, and confidence."}]
    expose: ["8080"]
    volumes:
      - packet-expert-open-webui-data:/app/backend/data
      - ./openwebui/static/custom.css:/app/backend/open_webui/static/custom.css:ro
      - ./openwebui/static/loader.js:/app/backend/open_webui/static/loader.js:ro
      - ./openwebui/static/nettap-main-logo.png:/app/backend/open_webui/static/nettap-main-logo.png:ro
    networks: [backend, user-access]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  backend:
    internal: true
  user-access:
    internal: true

volumes:
  packet-expert-ollama-data: {}
  packet-expert-open-webui-data: {}
  packet-expert-gateway-data: {}
  packet-expert-gateway-config: {}
