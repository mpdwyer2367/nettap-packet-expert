# The canonical product uses its own Compose identity. Legacy Packet Expert
# volumes remain offline and are migrated only through an explicit backup and
# restore procedure; they are never attached to a fresh production install.
name: nettap-network-intelligence

services:
  ollama:
    image: ${OLLAMA_IMAGE}
    init: true
    restart: unless-stopped
    cpus: ${OLLAMA_CPUS}
    mem_limit: ${OLLAMA_MEMORY}
    pids_limit: 1024
    volumes:
      - packet-expert-ollama-data:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  model-init:
    image: ${OLLAMA_IMAGE}
    profiles: ["initialize"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./model:/model:ro
    networks: [backend]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${BASE_MODEL} &&
        actual_id="$$(ollama list | awk '$$1 == "${BASE_MODEL}" {print $$2}')" &&
        test "$$actual_id" = "${EXPECTED_BASE_MODEL_ID}" &&
        ollama create ${NETTAP_AI_MODEL} -f /model/nettap-ai.Modelfile &&
        ollama show ${NETTAP_AI_MODEL}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  rag-cache-init:
    image: ${OPEN_WEBUI_IMAGE}
    profiles: ["initialize"]
    environment:
      RAG_EMBEDDING_MODEL_ID: ${RAG_EMBEDDING_MODEL_ID}
      RAG_EMBEDDING_MODEL_REVISION: ${RAG_EMBEDDING_MODEL_REVISION}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
      RAG_EMBEDDING_STATE: /app/backend/data/nettap-embedding-model.json
    volumes:
      - ./provisioning:/provision:ro
      - packet-expert-open-webui-data:/app/backend/data
    networks: [backend]
    entrypoint: ["python", "/provision/cache_embedding_model.py"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    init: true
    restart: unless-stopped
    cpus: ${WEBUI_CPUS}
    mem_limit: ${WEBUI_MEMORY}
    pids_limit: 1024
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_NAME: "NetTAP Network Intelligence"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "True"
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      ENABLE_SIGNUP: "False"
      DEFAULT_USER_ROLE: pending
      ENABLE_PASSWORD_VALIDATION: "True"
      ENABLE_PASSWORD_CHANGE_FORM: "True"
      PASSWORD_HASH_ALGORITHM: bcrypt
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PASSWORD_VALIDATION_REGEX_PATTERN: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{12,72}$$'
      PASSWORD_VALIDATION_HINT: "Use 12-72 characters with upper, lower, number, and symbol."
      ENABLE_PERSISTENT_CONFIG: "False"
      OFFLINE_MODE: "True"
      HF_HUB_OFFLINE: "1"
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "False"
      RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "False"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "False"
      WHISPER_MODEL_AUTO_UPDATE: "False"
      ENABLE_OPENAI_API: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      ENABLE_RAG_LOCAL_WEB_FETCH: "False"
      ENABLE_SUBAGENTS: "False"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_EXPORT: "False"
      USER_PERMISSIONS_CHAT_IMPORT: "False"
      USER_PERMISSIONS_CHAT_SHARE: "False"
      USER_PERMISSIONS_CHAT_ALLOW_PUBLIC_SHARING: "False"
      USER_PERMISSIONS_CHAT_ALLOW_OPEN_SHARING: "False"
      USER_PERMISSIONS_CHAT_CONTINUE_RESPONSE: "False"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "False"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "False"
      USER_PERMISSIONS_FEATURES_USER_WEBHOOKS: "False"
      USER_PERMISSIONS_FEATURES_API_KEYS: "False"
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT: "False"
      USER_PERMISSIONS_WORKSPACE_SKILLS_EXPORT: "False"
      AUDIT_LOG_LEVEL: METADATA
      ENABLE_AUDIT_LOGS_FILE: "True"
      AUDIT_LOGS_FILE_PATH: /app/backend/data/audit.log
      AUDIT_LOG_FILE_ROTATION_SIZE: 10MB
      ENABLE_AUDIT_STDOUT: "True"
      GLOBAL_LOG_LEVEL: INFO
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "False"
      ENABLE_API_KEYS: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_USER_WEBHOOKS: "False"
      ENABLE_MEMORIES: "False"
      ENABLE_ADMIN_EXPORT: "False"
      ENABLE_ADMIN_CHAT_ACCESS: "False"
      BYPASS_ADMIN_ACCESS_CONTROL: "False"
      SHOW_ADMIN_DETAILS: "False"
      ENABLE_PUBLIC_ACTIVE_USERS_COUNT: "False"
      ENABLE_USER_STATUS: "False"
      RESPONSE_WATERMARK: "AI-generated engineering guidance; verify before use."
      IFRAME_CSP: "default-src 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; script-src 'none'; frame-src 'none'"
      DEFAULT_MODELS: ${NETTAP_VISIBILITY_PROFILE}
      DEFAULT_PINNED_MODELS: ${NETTAP_VISIBILITY_PROFILE},${NETTAP_PACKET_EXPERT_PROFILE}
      MODEL_ORDER_LIST: "[\"${NETTAP_VISIBILITY_PROFILE}\",\"${NETTAP_PACKET_EXPERT_PROFILE}\",\"${NETTAP_AI_MODEL}\"]"
      WEBUI_BANNERS: >-
        [{"id":"nettap-network-intelligence-admin-activation-rc5","type":"warning","title":"Complete administrator activation","content":"This installation generated a unique bootstrap credential. Change it in Settings > Account, verify the old credential fails, then run the administrator finalization command before enabling production access.","dismissible":false,"timestamp":1785864000}]
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["Start with","my goal"],"content":"Ask me one simple question to understand what I want to accomplish."},{"title":["Explain this","assistant"],"content":"Briefly explain what this selected NetTAP assistant can help me do."},{"title":["Help me","decide"],"content":"I am not sure where to start. Ask me one important question at a time."}]
    expose: ["8080"]
    volumes:
      - packet-expert-open-webui-data:/app/backend/data
    networks: [backend, user-access]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  assistant-provisioner:
    image: ${OPEN_WEBUI_IMAGE}
    profiles: ["provision"]
    depends_on:
      open-webui:
        condition: service_healthy
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      RELEASE_VERSION: ${RELEASE_VERSION}
      NETTAP_AI_MODEL: ${NETTAP_AI_MODEL}
      NETTAP_PROVISIONING_MANIFEST: /provision/open-webui.json
      NETTAP_PROVISIONING_CHECKSUMS: /provision/knowledge-sources.sha256
      NETTAP_PROVISIONING_SOURCE_ROOT: /source
      NETTAP_PROVISIONING_STATE: /app/backend/data/nettap-provisioning-state.json
    volumes:
      - ./provisioning:/provision:ro
      - ./assistants:/source/assistants:ro
      - ./skills:/source/skills:ro
      - ./knowledge:/source/knowledge:ro
      - packet-expert-open-webui-data:/app/backend/data
    networks: [backend]
    entrypoint: ["python", "/provision/provision_open_webui.py"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  evidence-service:
    image: ${OPEN_WEBUI_IMAGE}
    init: true
    restart: unless-stopped
    cpus: ${EVIDENCE_CPUS}
    mem_limit: ${EVIDENCE_MEMORY}
    pids_limit: 256
    environment:
      PYTHONPATH: /service
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EVIDENCE_API_TOKEN: ${EVIDENCE_API_TOKEN}
      NETTAP_EVIDENCE_HOST: 0.0.0.0
      NETTAP_EVIDENCE_PORT: 8081
      NETTAP_EVIDENCE_DB: /data/nettap-evidence.db
      NETTAP_EVIDENCE_DATA_DIR: /data/files
      NETTAP_EVIDENCE_MAX_UPLOAD_BYTES: ${EVIDENCE_MAX_UPLOAD_BYTES}
      NETTAP_EVIDENCE_MAX_RECORDS: ${EVIDENCE_MAX_RECORDS}
    entrypoint: ["python", "-m", "case_service"]
    volumes:
      - ./case_service:/service/case_service:ro
      - packet-expert-evidence-data:/data
    expose: ["8081"]
    networks: [backend, user-access]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  backend:
    internal: true
  user-access:
    internal: true

volumes:
  packet-expert-ollama-data: {}
  packet-expert-open-webui-data: {}
  packet-expert-evidence-data: {}
  packet-expert-gateway-data: {}
  packet-expert-gateway-config: {}
