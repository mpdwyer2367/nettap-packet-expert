services:
  analyst-console:
    image: ${CONSOLE_IMAGE:-nettap/analyst-console:0.4.0-rc.1}
    build:
      context: ./console
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONSOLE_NODE_IMAGE:-node:22.18.0-bookworm-slim@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e}
        PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL for the pre-production console}
        PUBLIC_SUPABASE_PUBLISHABLE: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY for the pre-production console}
    init: true
    restart: unless-stopped
    cpus: ${CONSOLE_CPUS:-2}
    mem_limit: ${CONSOLE_MEMORY:-2g}
    pids_limit: 512
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      NETTAP_AI_MODEL: ${NETTAP_AI_MODEL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY for trusted server operations}
    expose: ["3000"]
    networks: [backend, console-access, console-egress]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  console-gateway:
    image: ${CADDY_IMAGE}
    init: true
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      analyst-console:
        condition: service_healthy
    environment:
      CONSOLE_SUPABASE_HTTPS_ORIGIN: ${SUPABASE_URL}
      CONSOLE_SUPABASE_WSS_ORIGIN: ${SUPABASE_WSS_URL:?Set SUPABASE_WSS_URL, for example wss://project.supabase.co}
    ports:
      - "${HTTPS_BIND_ADDRESS}:${CONSOLE_HTTPS_PORT:-9443}:443"
    volumes:
      - ./config/Console.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/tls:/etc/caddy/tls:ro
      - packet-expert-console-gateway-data:/data
      - packet-expert-console-gateway-config:/config
    networks: [console-access]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  console-access:
    internal: true
  console-egress: {}

volumes:
  packet-expert-console-gateway-data: {}
  packet-expert-console-gateway-config: {}
