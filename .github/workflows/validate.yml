name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3 pydantic==2.13.4
      - name: Install pinned Packer validator
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/packer.zip \
            https://releases.hashicorp.com/packer/1.15.4/packer_1.15.4_linux_amd64.zip
          echo '15f97a6a99645c7d5308c609973b5280837b38e112beac413ccbce80da927cf1  /tmp/packer.zip' | sha256sum --check --strict
          mkdir -p /tmp/packer-bin
          unzip -q /tmp/packer.zip packer -d /tmp/packer-bin
          sudo install -m 0755 /tmp/packer-bin/packer /usr/local/bin/packer
      - name: Lint shell entry points
        run: |
          shellcheck scripts/*.sh scripts/nettap-ai scripts/nettap-packet-expert tests/*.sh
          shellcheck scripts/nettapctl
          find appliance -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Run static checks
        run: ./tests/static-checks.sh
      - name: Validate OVA appliance sources
        run: ./tests/appliance-source-checks.sh
      - name: Validate analyst console integration sources
        run: ./tests/console-source-checks.sh
      - name: Validate Packer plugin schemas
        run: |
          mkdir -p /tmp/nettap-packer-evidence
          git archive --format=tar.gz -o /tmp/nettap-source.tar.gz HEAD
          packer init appliance/packer
          packer validate \
            -var source_archive=/tmp/nettap-source.tar.gz \
            -var evidence_directory=/tmp/nettap-packer-evidence \
            appliance/packer
      - name: Test native model installer verification
        run: ./tests/native-model-installer-mock.sh
      - name: Test legacy model retirement safeguards
        run: ./tests/retire-legacy-models-mock.sh
      - name: Test Open WebUI provisioning contract
        run: python3 -m unittest -v tests/test_provision_open_webui.py tests/test_verify_archive_tree.py tests/test_case_service.py tests/test_evidence_filter.py
      - name: Compile provisioning code
        run: python3 -m py_compile provisioning/*.py case_service/*.py functions/*.py appliance/*.py tests/generate-packet-fixtures.py tests/inspect_ova.py scripts/verify-archive-tree.py
      - name: Render supported Compose profiles
        run: |
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.local.yaml config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml -f compose.bootstrap.yaml \
            --profile initialize config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml -f appliance/compose.appliance.yaml \
            --profile initialize config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml -f compose.console.yaml \
            config --quiet
      - name: Parse PowerShell deployment
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/start-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/retire-legacy-models.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/install-model-native.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Build and verify unsigned source candidate
        run: |
          ./scripts/package-release.sh --unsigned-candidate
          ./scripts/verify-release.sh dist/nettap-ai-suite-0.4.0-rc.1-source.tar.gz
      - name: Build and verify combined model bundle
        run: |
          ./scripts/package-model-bundle.sh
          ./scripts/verify-model-bundle.sh dist/nettap-ai-model-0.4.0-rc.1.tar.gz

  analyst-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
