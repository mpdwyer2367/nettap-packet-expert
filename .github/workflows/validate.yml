name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Lint shell entry points
        run: shellcheck scripts/*.sh scripts/nettap-ai scripts/nettap-packet-expert tests/*.sh
      - name: Run static checks
        run: ./tests/static-checks.sh
      - name: Test native model installer verification
        run: ./tests/native-model-installer-mock.sh
      - name: Test legacy model retirement safeguards
        run: ./tests/retire-legacy-models-mock.sh
      - name: Test Open WebUI provisioning contract
        run: python3 -m unittest -v tests/test_provision_open_webui.py tests/test_manage_open_webui_user.py tests/test_verify_archive_tree.py tests/test_case_service.py
      - name: Compile provisioning code
        run: python3 -m py_compile provisioning/*.py case_service/*.py scripts/verify-archive-tree.py
      - name: Render supported Compose profiles
        run: |
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.local.yaml config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml config --quiet
          docker compose --env-file .env.example \
            -f compose.yaml -f compose.production.yaml -f compose.bootstrap.yaml \
            --profile initialize config --quiet
      - name: Parse PowerShell deployment
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/start-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/retire-legacy-models.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/install-model-native.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Build and verify unsigned source candidate
        run: |
          ./scripts/package-release.sh --unsigned-candidate
          ./scripts/verify-release.sh dist/nettap-ai-suite-0.3.0-rc.4-source.tar.gz
      - name: Build and verify combined model bundle
        run: |
          ./scripts/package-model-bundle.sh
          ./scripts/verify-model-bundle.sh dist/nettap-ai-model-0.3.0-rc.4.tar.gz
